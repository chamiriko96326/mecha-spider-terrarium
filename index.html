<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械蜘蛛 · 生态缸</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b5a5c; overflow: hidden; }
  body { font-family: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; color: #e9f3f2; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; outline: none; }
  .bar { position: fixed; z-index: 2; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: max(18px, env(safe-area-inset-top)) 24px 18px; pointer-events: none; }
  h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .08em; text-shadow: 0 1px 8px rgba(0, 30, 32, .6); white-space: nowrap; }
  .btns { display: flex; gap: 8px; pointer-events: auto; }
  button { font: inherit; font-size: 15px; letter-spacing: .1em; color: inherit; min-height: 40px; padding: 0 18px; border-radius: 20px; cursor: pointer;
    background: rgba(5, 34, 37, .62); border: 1px solid rgba(214, 240, 238, .28); transition: background .2s, border-color .2s, transform .1s; display: inline-flex; align-items: center; gap: 8px; }
  button:hover { background: rgba(10, 56, 60, .8); border-color: rgba(214, 240, 238, .55); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid #bff3f2; outline-offset: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5d7476; transition: background .3s, box-shadow .3s; }
  button[aria-pressed="true"] .dot { background: #ffe2b0; box-shadow: 0 0 8px #ffe2b0; }
  .hint { position: fixed; z-index: 2; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0; padding: 7px 16px; border-radius: 16px;
    font-size: 14px; letter-spacing: .06em; color: #d9ebe9; background: rgba(5, 34, 37, .5); white-space: nowrap; pointer-events: none; }
  .status { position: fixed; z-index: 3; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; letter-spacing: .1em; pointer-events: none; }
  .status[hidden] { display: none; }
  @media (max-width: 520px) {
    .bar { padding-left: 14px; padding-right: 14px; }
    h1 { font-size: 16px; }
    button { padding: 0 13px; font-size: 14px; }
    .hint { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>机械蜘蛛 · 生态缸</h1>
  <div class="btns">
    <button id="btnSpray" type="button">喷淋</button>
    <button id="btnLight" type="button" aria-pressed="true"><span class="dot"></span>灯光</button>
  </div>
</div>
<p class="hint">点地面，它会爬过去 · 拖动旋转，滚轮拉近</p>
<div class="status" id="status" role="status">正在搭建生态缸…</div>
